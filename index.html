<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f5fc" />
    <meta name="description" content="SKY, tu compañero. Tu claridad. Tu camino." />
    <title>SKY — Tu compañero</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2.5 14.6 9.4 21.5 12l-6.9 2.6L12 21.5l-2.6-6.9L2.5 12l6.9-2.6L12 2.5Z" fill="currentColor" /></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3.5 10.8 8.5-7 8.5 7v9.1a1.6 1.6 0 0 1-1.6 1.6h-4.5v-6.2h-4.8v6.2H5.1a1.6 1.6 0 0 1-1.6-1.6v-9.1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" /></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h12.2a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2v-13Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M5 16.5a2 2 0 0 1 2-2h12.2M9 8h6M9 11h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="4.8" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19.5V5M4 19.5h16M7.5 15l3.3-3.6 3 2.1 5-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.9 7.5h2.9v2.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.7a7.8 7.8 0 0 1-8.2 7.6 9.3 9.3 0 0 1-3.6-.7L4 20l1.2-3.6A7.2 7.2 0 0 1 4 12.2a7.8 7.8 0 0 1 8.2-7.6 7.8 7.8 0 0 1 7.8 7.1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.3 12h.1m3.5 0h.1m3.5 0h.1" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2.5 12h2m15 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10m-4 4v2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-face" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 14.2a4.2 4.2 0 0 0 7 0M9 9.5h.1m5.8 0h.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-fire" viewBox="0 0 24 24"><path d="M13.1 2.8c.8 3.4-1.1 4.7-2.8 6.1-1.4 1.2-2.8 2.5-2.8 5a4.5 4.5 0 0 0 9 0c0-1.9-.8-3.4-2.1-4.7.1 2.1-1 2.8-1.7 3.1.2-4-1-7.2-3.1-9.5 0 0 1.9.3 3.5 0Z" fill="currentColor" opacity=".9"/><path d="M12 22a7.2 7.2 0 0 0 7.2-7.2c0-2.8-1.4-5-3.6-6.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </svg>

    <template id="mascotTemplate">
      <svg class="mascot mascot--curious" viewBox="0 0 190 190" role="img" aria-label="La mascota de SKY">
        <defs>
          <linearGradient id="mascotBody" x1="45" y1="48" x2="125" y2="176" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".58" stop-color="#f0f5ff"/><stop offset="1" stop-color="#c9dcff"/></linearGradient>
          <radialGradient id="mascotGlow" cx="0" cy="0" r="1" gradientTransform="matrix(28 0 0 28 132 56)" gradientUnits="userSpaceOnUse"><stop stop-color="#67e8f9" stop-opacity=".9"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
          <filter id="mascotShadow" x="16" y="22" width="160" height="164" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#758acb" flood-opacity=".2"/></filter>
        </defs>
        <circle cx="132" cy="56" r="29" fill="url(#mascotGlow)"/>
        <path d="M125 54V31" stroke="#61d8f5" stroke-width="4" stroke-linecap="round"/><circle cx="125" cy="27" r="7" fill="#61d8f5"/><circle cx="125" cy="27" r="12" fill="#61d8f5" opacity=".17"/>
        <path d="M50 121c-11-2-18 5-18 14 0 10 8 17 19 16m88-30c11-2 18 5 18 14 0 10-8 17-19 16" fill="url(#mascotBody)" stroke="#c7d8fb" stroke-width="2"/>
        <path d="M95 45c-29 0-50 23-50 54v36c0 20 14 35 34 35 7 0 11-7 16-7s9 7 16 7c20 0 34-15 34-35V99c0-31-21-54-50-54Z" fill="url(#mascotBody)" stroke="#c7d8fb" stroke-width="2" filter="url(#mascotShadow)"/>
        <ellipse cx="75" cy="167" rx="17" ry="5" fill="#b9cefa" opacity=".5"/><ellipse cx="115" cy="167" rx="17" ry="5" fill="#b9cefa" opacity=".5"/>
        <ellipse class="eye-open eye-left" cx="77" cy="105" rx="8" ry="10" fill="#14264f"/><ellipse class="eye-open eye-right" cx="113" cy="105" rx="8" ry="10" fill="#14264f"/>
        <circle class="eye-shine" cx="79" cy="102" r="2.3" fill="#fff"/><circle class="eye-shine" cx="115" cy="102" r="2.3" fill="#fff"/>
        <path class="eyes-happy" d="M69 105q8-9 16 0m20 0q8-9 16 0" fill="none" stroke="#14264f" stroke-width="3.4" stroke-linecap="round"/>
        <path class="mouth mouth-smile" d="M88 122c4 5 10 5 14 0" fill="none" stroke="#3256aa" stroke-width="2.6" stroke-linecap="round"/>
        <path class="mouth mouth-think" d="M89 126h11" fill="none" stroke="#3256aa" stroke-width="2.4" stroke-linecap="round"/>
        <path class="support-arms" d="M53 141q-10-4-14 3m98-3q10-4 14 3" fill="none" stroke="#c7d8fb" stroke-width="8" stroke-linecap="round"/>
        <path class="support-heart" d="M95 148c-8-7-15 5 0 14 15-9 8-21 0-14Z" fill="#f3a9c8"/>
        <ellipse cx="67" cy="128" rx="7" ry="4" fill="#f7b6c9" opacity=".55"/><ellipse cx="123" cy="128" rx="7" ry="4" fill="#f7b6c9" opacity=".55"/>
      </svg>
    </template>

    <div class="onboarding-root" id="onboardingRoot"></div>
    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <a class="brand" href="#inicio" data-view="home" aria-label="SKY, inicio">
          <span class="brand-mark"><svg class="icon"><use href="#i-sparkle"/></svg></span>
          <span class="brand-word">SKY</span>
        </a>
        <p class="brand-tagline">Tu compañero.<br />Tu claridad. Tu camino.</p>

        <div class="nav-label">TU ESPACIO</div>
        <nav class="nav-list">
          <button class="nav-item is-active" type="button" data-view="home"><svg class="icon"><use href="#i-home"/></svg><span>Inicio</span></button>
          <button class="nav-item" type="button" data-view="timeline"><svg class="icon"><use href="#i-calendar"/></svg><span>Timeline</span><span class="nav-dot"></span></button>
          <button class="nav-item" type="button" data-view="goals"><svg class="icon"><use href="#i-target"/></svg><span>Objetivos</span></button>
          <button class="nav-item" type="button" data-view="insights"><svg class="icon"><use href="#i-chart"/></svg><span>Insights</span></button>
          <button class="nav-item" type="button" data-view="chat"><svg class="icon"><use href="#i-chat"/></svg><span>Chat con SKY</span></button>
        </nav>

        <div class="sidebar-spacer"></div>
        <div class="privacy-note"><svg class="icon"><use href="#i-lock"/></svg><span>Un espacio para ti,<br />a tu ritmo.</span></div>
        <button class="profile-button" type="button" data-view="profile">
          <span class="profile-avatar"><svg class="icon"><use href="#i-user"/></svg></span>
          <span class="profile-copy"><strong>Tu perfil</strong><small>Privacidad y ajustes</small></span>
          <span class="profile-chevron">···</span>
        </button>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark"><svg class="icon"><use href="#i-sparkle"/></svg></span><span class="brand-word">SKY</span></div>
          <div class="breadcrumbs"><span>Tu espacio</span><span class="crumb-slash">/</span><strong id="topbarSection">Inicio</strong></div>
          <div class="topbar-right"><span class="gentle-pill"><svg class="icon"><use href="#i-sparkle"/></svg> Sin prisa, a tu manera</span><button class="mobile-menu" type="button" id="menuButton" aria-label="Abrir menú"><span></span><span></span></button></div>
        </header>
        <div class="content-wrap" id="viewRoot"></div>
      </main>
    </div>

    <aside class="sky-buddy" id="skyBuddy" hidden aria-label="Atajo de SKY">
      <div class="sky-buddy-panel" id="skyBuddyPanel" hidden>
        <button class="icon-button sky-buddy-close" type="button" id="skyBuddyClose" aria-label="Cerrar">×</button>
        <div class="sky-buddy-panel-head"><span class="sky-buddy-avatar" id="skyBuddyPanelAvatar"></span><div><strong>Hola, soy SKY</strong><small>¿Qué te vendría bien ahora?</small></div></div>
        <button class="buddy-action" type="button" data-view="chat"><svg class="icon" aria-hidden="true"><use href="#i-chat"></use></svg> Hablar conmigo</button>
        <button class="buddy-action" type="button" data-view="timeline"><svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg> Guardar un momento</button>
        <button class="buddy-action" type="button" data-view="goals"><svg class="icon" aria-hidden="true"><use href="#i-target"></use></svg> Revisar mis objetivos</button>
      </div>
      <button class="sky-buddy-toggle" type="button" id="skyBuddyToggle" aria-expanded="false" aria-controls="skyBuddyPanel">
        <span class="sky-buddy-avatar" id="skyBuddyAvatar"></span><span class="sky-buddy-label"><strong>SKY</strong><small>Estoy aquí</small></span><span class="buddy-sparkle">✦</span>
      </button>
    </aside>

    <nav class="mobile-nav" aria-label="Navegación móvil">
      <button class="mobile-nav-item is-active" type="button" data-view="home"><svg class="icon"><use href="#i-home"/></svg><span>Inicio</span></button>
      <button class="mobile-nav-item" type="button" data-view="timeline"><svg class="icon"><use href="#i-calendar"/></svg><span>Timeline</span></button>
      <button class="mobile-nav-create" type="button" data-view="chat" aria-label="Hablar con SKY"><svg class="icon"><use href="#i-plus"/></svg></button>
      <button class="mobile-nav-item" type="button" data-view="goals"><svg class="icon"><use href="#i-target"/></svg><span>Objetivos</span></button>
      <button class="mobile-nav-item" type="button" data-view="profile"><svg class="icon"><use href="#i-user"/></svg><span>Perfil</span></button>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
